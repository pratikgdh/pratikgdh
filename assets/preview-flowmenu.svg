<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" width="100%" height="150">
  <defs>
    <radialGradient id="cursorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0" />
    </radialGradient>
    <pattern id="viewportGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262D" stroke-width="0.8" />
    </pattern>
  </defs>
  <style>
    .cursor-anim {
      animation: cursorMove 3.5s infinite ease-in-out;
    }
    .menu-popup {
      animation: menuPopup 3.5s infinite ease-in-out;
      transform-origin: 190px 75px;
    }
    .item-highlight {
      animation: itemHover 3.5s infinite ease-in-out;
    }
    .spawned-actor {
      animation: spawnActor 3.5s infinite ease-in-out;
      transform-origin: 220px 85px;
    }
    @keyframes cursorMove {
      0%, 15% { transform: translate(60px, 110px); }
      30%, 65% { transform: translate(185px, 70px); }
      80%, 100% { transform: translate(250px, 40px); }
    }
    @keyframes menuPopup {
      0%, 20% { opacity: 0; transform: scale(0.7); }
      30%, 70% { opacity: 1; transform: scale(1); }
      80%, 100% { opacity: 0; transform: scale(0.9); }
    }
    @keyframes itemHover {
      0%, 40% { fill: #21262D; }
      45%, 70% { fill: #1F6FEB; }
      75%, 100% { fill: #21262D; }
    }
    @keyframes spawnActor {
      0%, 65% { opacity: 0; transform: scale(0.2); }
      75%, 95% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.8); }
    }
  </style>

  <!-- Viewport Background Grid -->
  <rect width="100%" height="100%" fill="#0D1117" rx="8" />
  <rect width="100%" height="100%" fill="url(#viewportGrid)" rx="8" />

  <!-- Viewport Axis Indicator -->
  <g opacity="0.6" transform="translate(15, 135)">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#F85149" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#3FB950" stroke-width="2" />
    <text x="22" y="4" fill="#F85149" font-family="sans-serif" font-size="8">X</text>
    <text x="-4" y="-22" fill="#3FB950" font-family="sans-serif" font-size="8">Z</text>
  </g>

  <!-- Spawning Mesh / Actor -->
  <g class="spawned-actor" transform="translate(220, 85)">
    <rect x="-18" y="-18" width="36" height="36" fill="#1F6FEB" fill-opacity="0.3" stroke="#58A6FF" stroke-width="1.5" rx="4" />
    <circle cx="0" cy="0" r="4" fill="#58A6FF" />
    <text x="-16" y="30" fill="#58A6FF" font-family="sans-serif" font-size="9" font-weight="bold">Spawned Actor</text>
  </g>

  <!-- FlowMenu Quick-Add Popup Menu -->
  <g class="menu-popup" transform="translate(130, 25)">
    <!-- Menu Container -->
    <rect x="0" y="0" width="125" height="98" fill="#161B22" stroke="#30363D" stroke-width="1.2" rx="6" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
    <rect x="0" y="0" width="125" height="20" fill="#21262D" rx="6" />
    <text x="8" y="14" fill="#8B949E" font-family="sans-serif" font-size="9" font-weight="600">⚡ FlowMenu Quick Add</text>

    <!-- Menu Items -->
    <rect x="6" y="26" width="113" height="18" rx="4" fill="#21262D" />
    <text x="14" y="38" fill="#E6EDF3" font-family="sans-serif" font-size="9">📦 Static Mesh</text>

    <!-- Hovered Target Item -->
    <rect x="6" y="48" width="113" height="18" rx="4" class="item-highlight" />
    <text x="14" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="600">🎯 Actor Blueprint</text>

    <rect x="6" y="70" width="113" height="18" rx="4" fill="#21262D" />
    <text x="14" y="82" fill="#E6EDF3" font-family="sans-serif" font-size="9">💡 Point Light</text>
  </g>

  <!-- Animated Cursor -->
  <g class="cursor-anim">
    <circle cx="0" cy="0" r="14" fill="url(#cursorGlow)" />
    <polygon points="0,0 4,14 7,10 12,16 14,14 9,9 15,7" fill="#FFFFFF" stroke="#0D1117" stroke-width="1" />
  </g>
</svg>
