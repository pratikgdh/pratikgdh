<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7ED" stop-opacity="1" />
      <stop offset="25%" stop-color="#FBBF24" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>

    <radialGradient id="planet1Grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0891B2" />
    </radialGradient>

    <radialGradient id="planet2Grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>

    <radialGradient id="planet3Grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </radialGradient>

    <radialGradient id="planet4Grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </radialGradient>

    <radialGradient id="planet5Grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .star {
      fill: #ffffff;
      animation: pulse 3s infinite ease-in-out alternate;
    }
    .orbit {
      fill: none;
      stroke: #30363D;
      stroke-width: 1.2;
      stroke-dasharray: 4 6;
      opacity: 0.6;
    }
    .orbit-solid {
      fill: none;
      stroke: #21262D;
      stroke-width: 1;
      opacity: 0.8;
    }

    /* Orbit Animations */
    .orbit-group-1 {
      animation: rotateOrbit 12s linear infinite;
      transform-origin: 425px 180px;
    }
    .orbit-group-2 {
      animation: rotateOrbit 22s linear infinite;
      transform-origin: 425px 180px;
    }
    .orbit-group-3 {
      animation: rotateOrbit 38s linear infinite;
      transform-origin: 425px 180px;
    }
    .orbit-group-4 {
      animation: rotateOrbit 55s linear infinite;
      transform-origin: 425px 180px;
    }
    .orbit-group-5 {
      animation: rotateOrbit 80s linear infinite;
      transform-origin: 425px 180px;
    }

    .sun-pulse {
      animation: sunPulse 4s infinite ease-in-out alternate;
      transform-origin: 425px 180px;
    }

    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes sunPulse {
      0% { transform: scale(0.95); opacity: 0.85; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }
  </style>

  <!-- Deep Cosmic Background Canvas -->
  <rect width="100%" height="100%" fill="#0D1117" rx="14" />

  <!-- Background Stars & Nebula Particles -->
  <g opacity="0.8">
    <circle cx="50" cy="40" r="1" class="star" style="animation-delay: 0.2s;" />
    <circle cx="120" cy="90" r="1.5" class="star" style="animation-delay: 1.1s;" />
    <circle cx="210" cy="30" r="1" class="star" style="animation-delay: 2.3s;" />
    <circle cx="95" cy="280" r="1.2" class="star" style="animation-delay: 0.7s;" />
    <circle cx="180" cy="320" r="1.5" class="star" style="animation-delay: 1.8s;" />
    <circle cx="280" cy="340" r="1" class="star" style="animation-delay: 0.5s;" />
    <circle cx="760" cy="50" r="1.5" class="star" style="animation-delay: 1.4s;" />
    <circle cx="680" cy="95" r="1.2" class="star" style="animation-delay: 2.7s;" />
    <circle cx="790" cy="220" r="1" class="star" style="animation-delay: 0.3s;" />
    <circle cx="720" cy="310" r="1.5" class="star" style="animation-delay: 1.9s;" />
    <circle cx="620" cy="330" r="1" class="star" style="animation-delay: 2.1s;" />
    <circle cx="340" cy="45" r="1.2" class="star" style="animation-delay: 1.6s;" />
    <circle cx="510" cy="40" r="1" class="star" style="animation-delay: 0.9s;" />
  </g>

  <!-- Orbital Rings -->
  <circle cx="425" cy="180" r="55" class="orbit" />
  <circle cx="425" cy="180" r="95" class="orbit" />
  <circle cx="425" cy="180" r="145" class="orbit" />
  <circle cx="425" cy="180" r="200" class="orbit" />
  <circle cx="425" cy="180" r="265" class="orbit" />

  <!-- Orbiting Planets -->

  <!-- Orbit 1: Inner Tech Planet (Cyan) -->
  <g class="orbit-group-1">
    <circle cx="480" cy="180" r="6.5" fill="url(#planet1Grad)" filter="url(#softGlow)" />
    <!-- Moon -->
    <circle cx="491" cy="180" r="2" fill="#E2E8F0" opacity="0.8" />
  </g>

  <!-- Orbit 2: Emerald Core Planet (Green) -->
  <g class="orbit-group-2">
    <circle cx="330" cy="180" r="8" fill="url(#planet2Grad)" filter="url(#softGlow)" />
  </g>

  <!-- Orbit 3: Ringed Gas Giant (Pink / Magenta) -->
  <g class="orbit-group-3">
    <g transform="translate(570, 180)">
      <!-- Planetary Ring -->
      <ellipse cx="0" cy="0" rx="19" ry="5.5" fill="none" stroke="#F472B6" stroke-width="2" opacity="0.7" transform="rotate(-20)" />
      <!-- Planet Body -->
      <circle cx="0" cy="0" r="11" fill="url(#planet3Grad)" filter="url(#softGlow)" />
    </g>
  </g>

  <!-- Orbit 4: Systems / Engine Planet (Violet) -->
  <g class="orbit-group-4">
    <circle cx="225" cy="180" r="9.5" fill="url(#planet4Grad)" filter="url(#softGlow)" />
    <!-- Moon 1 & 2 -->
    <circle cx="211" cy="173" r="2" fill="#CBD5E1" />
    <circle cx="239" cy="188" r="1.5" fill="#94A3B8" />
  </g>

  <!-- Orbit 5: Outer Explorer Planet (Amber) -->
  <g class="orbit-group-5">
    <circle cx="690" cy="180" r="8.5" fill="url(#planet5Grad)" filter="url(#softGlow)" />
  </g>

  <!-- Central Star / Sun Core -->
  <circle cx="425" cy="180" r="45" fill="url(#sunGlow)" class="sun-pulse" />
  <circle cx="425" cy="180" r="22" fill="url(#sunCore)" filter="url(#glow)" />
  <circle cx="425" cy="180" r="14" fill="#FFFFFF" opacity="0.9" />

  <!-- Clean Minimalist Header Overlay Tag -->
  <g opacity="0.65">
    <text x="30" y="35" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">REPOSITORY ORBIT • SOLAR SYSTEM</text>
  </g>
</svg>
